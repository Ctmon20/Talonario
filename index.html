<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smartphones PMAL</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b4ea2">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
  <div id="telaLogin" class="login-overlay">
    <div class="login-box">
      <div class="login-icon"><img src="logo.png" alt="Logo PMAL"></div>
      <h2>Smartphones</h2>
      <p class="login-sub">Polícia Militar de Alagoas</p>

      <div class="perfil-tabs">
        <button type="button" class="perfil-tab active" data-perfil="visualizador">
          <i class="fa-solid fa-eye"></i> Visualizador
        </button>
        <button type="button" class="perfil-tab" data-perfil="admin">
          <i class="fa-solid fa-user-shield"></i> Admin
        </button>
      </div>

      <form id="formLogin">
        <input type="password" id="senhaLogin" placeholder="Digite a senha de acesso..." required>
        <button type="submit" id="btnEntrar" class="btn-entrar">Entrar</button>
      </form>
      <p id="erroLogin" class="erro-login hidden"></p>
    </div>
  </div>

  <div id="loading" class="hidden">
    <div class="spinner"></div>
    <p>Carregando informações...</p>
  </div>

  <div id="home" class="hidden">
    <header class="topo">
      <div>
        <h1>📱 Smartphones</h1>
        <small>Polícia Militar de Alagoas</small>
      </div>
      <div class="topo-acoes">
        <button id="tema" class="card-btn">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="btnSair" class="card-btn" title="Sair do sistema">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>
    <section class="dashboard">
      <button id="atualizar" class="card-btn">
        <i class="fa-solid fa-sync"></i> Atualizar
      </button>
      <div class="indicador azul">
        <div><span id="totalAparelhos">0</span><small> - Aparelhos</small></div>
        <i class="fa-solid fa-mobile-screen"></i>
      </div>
      <div class="indicador verde">
        <div><span id="totalBatalhoes">0</span><small> - Batalhões</small></div>
        <i class="fa-solid fa-building-shield"></i>
      </div>
      <div class="indicador roxo">
        <div>
            <span id="totalImpressorasDashboard">0</span>
            <small> - Impressoras</small>
        </div>
        <i class="fa-solid fa-print"></i>
      </div>
      <div class="indicador laranja">
        <div><span id="totalEntregues">0</span><small> - Kits Entregues</small></div>
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <div class="indicador vermelho">
        <div><span id="totalPendentes">0</span><small> - Kits Pendentes</small></div>
        <i class="fa-solid fa-clock"></i>
      </div>
    </section>
    <div class="pesquisa"><input type="text" id="pesquisa" placeholder="Pesquisar batalhão, local ou PAT..."></div>
    <div id="listaBatalhoes"></div>
    <footer>Última atualização: <span id="ultimaAtualizacao"></span></footer>
  </div>

  <div id="detalhes" class="hidden">
    <div class="detalhes-header">
        <div class="nav-topo"><button id="voltar" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i></button></div>
        <h1 id="tituloBatalhao" class="titulo-destaque"></h1>
        <div class="stats-grid">
            <div class="stat-card"><span class="label">Local</span><span id="local" class="valor"></span></div>
            <div class="stat-card"><span class="label">Smartphones</span><span id="quantidade" class="valor"></span></div>
            <div class="stat-card"><span class="label">Impressoras</span><span id="totalImpressorasDetalhes" class="valor">0</span></div>
        </div>
    </div>
    
    <h2 style="padding: 10px;">Smartphones e Impressoras</h2>
    <div id="listaIMEI"></div>

    <h2 style="padding: 10px;">Observação</h2>
    <textarea id="observacao" placeholder="Adicione observações sobre a entrega aqui..."></textarea>
    <button id="btnSalvarObs" class="btnSalvarObs">Salvar Observação</button>
  </div>

  <div id="meuModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="modalTitulo">Atenção</h3>
      <p id="modalMensagem"></p>
      <button onclick="fecharModal()">OK</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
