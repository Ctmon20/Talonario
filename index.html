<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega de Smartphones PMAL</title>
  <meta name="theme-color" content="#0b4ea2">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Carregando informações...</p>
  </div>

  <div id="home" class="hidden">
    <header class="topo">
      <div>
        <h1>📱 Entrega de Smartphones</h1>
        <small>Polícia Militar de Alagoas</small>
      </div>
      <button id="tema" class="card-btn">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>
    <section class="dashboard">
      <button id="atualizar" class="card-btn">
        <i class="fa-solid fa-sync"></i> Atualizar
      </button>
      <div class="indicador azul">
        <div><span id="totalAparelhos">0</span><small> - Aparelhos</small></div>
        <i class="fa-solid fa-mobile-screen"></i>
      </div>
      <div class="indicador verde">
        <div><span id="totalBatalhoes">0</span><small> - Batalhões</small></div>
        <i class="fa-solid fa-building-shield"></i>
      </div>
      <div class="indicador roxo">
        <div>
            <span id="totalImpressorasDashboard">0</span>
            <small> - Impressoras</small>
        </div>
        <i class="fa-solid fa-print"></i>
    </div>

      
      <div class="indicador laranja">
        <div><span id="totalEntregues">0</span><small> - Kits Entregues</small></div>
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <div class="indicador vermelho">
        <div><span id="totalPendentes">0</span><small> - Kits Pendentes</small></div>
        <i class="fa-solid fa-clock"></i>
      </div>
    
    </section>
    <div class="pesquisa"><input type="text" id="pesquisa" placeholder="Pesquisar batalhão, local ou IMEI..."></div>
    <div id="listaBatalhoes"></div>
    <footer>Última atualização: <span id="ultimaAtualizacao"></span></footer>
  </div>

  <div id="detalhes" class="hidden">
    <div class="detalhes-header">
        <div class="nav-topo"><button id="voltar" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i></button></div>
        <h1 id="tituloBatalhao" class="titulo-destaque"></h1>
        <div class="stats-grid">
            <div class="stat-card"><span class="label">Local</span><span id="local" class="valor"></span></div>
            <div class="stat-card"><span class="label">Quantidade</span><span id="quantidade" class="valor"></span></div>
            <div class="stat-card"><span class="label">Impressoras</span><span id="totalImpressorasDetalhes" class="valor">0</span></div>
        </div>
    </div>
    
    <h2 style="padding: 10px;">IMEIs e Impressoras</h2>
    <div id="listaIMEI"></div>

    <h2 style="padding: 10px;">Observação</h2>
    <textarea id="observacao" placeholder="Adicione observações sobre a entrega aqui..."></textarea>
  </div>
  <script src="script.js"></script>
</body>
</html>
